[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-ai-2026s2"
version = "1.0.0"
dependencies = [
    "opencv-python==5.0.0.93",
    "mediapipe==0.10.14",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "Flask==3.1.3",
    "werkzeug==3.1.8"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
